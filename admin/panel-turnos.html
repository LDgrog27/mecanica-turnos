<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Turnos | Taller</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
  <div class="container-fluid py-4">

    <!-- Barra superior -->
    <nav class="navbar d-flex justify-content-between align-items-center px-4 mb-4">
      <h5 class="mb-0 text-white">Gestión de Turnos</h5>
      <div class="d-flex align-items-center gap-2">
        <span class="text-white small" id="usuario-info"></span>
        <a href="./panel-estadisticas.html" class="btn btn-outline-info btn-sm solo-admin d-none">
          <i class="bi bi-graph-up me-1"></i>Estadísticas
        </a>
        <a href="./cuentas.html" class="btn btn-outline-info btn-sm solo-admin d-none">
          <i class="bi bi-people me-1"></i>Cuentas
        </a>
        <a href="./servicios.html" class="btn btn-outline-info btn-sm solo-admin d-none">
          <i class="bi bi-wrench-adjustable me-1"></i>Servicios
        </a>
        <button type="button" class="btn btn-outline-success btn-sm" id="btn-refrescar" title="Actualizar datos">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button type="button" class="btn btn-outline-light btn-sm" id="btn-salir">
          <i class="bi bi-box-arrow-right me-1"></i>Salir
        </button>
      </div>
    </nav>

    <!-- Resumen -->
    <div class="row mb-4 g-3">
      <div class="col-md-4">
        <div class="card bg-primary text-white">
          <div class="card-body text-center">
            <h5 class="card-title" id="stats-total">0</h5>
            <p class="card-text mb-0">Turnos en la lista</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card bg-success text-white">
          <div class="card-body text-center">
            <h5 class="card-title" id="stats-hoy">0/8</h5>
            <p class="card-text mb-0">Turnos de hoy</p>
          </div>
        </div>
      </div>
      <div class="col-md-4 solo-admin d-none">
        <div class="card bg-info text-white">
          <div class="card-body text-center">
            <h5 class="card-title" id="stats-ingresos">$0</h5>
            <p class="card-text mb-0">Ingresos de hoy</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Búsqueda y filtros -->
    <div class="card mb-4">
      <div class="card-body py-3">
        <div class="row g-2 align-items-center">
          <div class="col-lg-3">
            <input type="search" class="form-control" id="buscar-turno" placeholder="Buscar por cliente o patente..." autocomplete="off">
          </div>
          <div class="col-lg-2">
            <select class="form-select" id="filtro-fecha">
              <option value="hoy">Hoy</option>
              <option value="manana">Mañana</option>
              <option value="semana">Esta semana</option>
              <option value="mes">Este mes</option>
              <option value="todos" selected>Todos</option>
            </select>
          </div>
          <div class="col-lg-2">
            <input type="date" class="form-control" id="filtro-fecha-desde" title="Desde">
          </div>
          <div class="col-lg-2">
            <input type="date" class="form-control" id="filtro-fecha-hasta" title="Hasta">
          </div>
          <div class="col-lg-2">
            <select class="form-select" id="filtro-servicio">
              <option value="todos">Todos los servicios</option>
            </select>
          </div>
          <div class="col-lg-1">
            <button type="button" class="btn btn-secundario w-100" id="btn-limpiar" title="Limpiar filtros">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Lista de turnos -->
    <div class="card">
      <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center">
        <h5 class="mb-0">
          Turnos
          <span class="badge ms-2" style="background-color: #ff6600;" id="total-turnos">0 turnos</span>
        </h5>
        <button type="button" class="btn btn-primario solo-editar d-none" id="btn-nuevo-turno">
          <i class="bi bi-plus-lg me-1"></i>Nuevo turno
        </button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-dark table-hover mb-0 align-middle">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Llegada</th>
                <th>Cliente</th>
                <th>Vehículo</th>
                <th>Servicio</th>
                <th class="solo-admin d-none">Precio</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-turnos"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: nuevo turno -->
  <div class="modal fade" id="modalNuevoTurno" tabindex="-1" aria-labelledby="modalNuevoTurnoLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-dark border-warning">
        <div class="modal-header border-warning">
          <h5 class="modal-title text-warning" id="modalNuevoTurnoLabel">
            <i class="bi bi-plus-circle me-2"></i>Nuevo turno
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="alerta-formulario"></div>
          <form id="formNuevoTurno">
            <h6 class="text-warning">Turno</h6>
            <div class="row g-3 mb-4">
              <div class="col-md-4">
                <label for="nuevoFecha" class="form-label">Fecha *</label>
                <input type="date" class="form-control" id="nuevoFecha" required>
                <div class="form-text" id="hint-cupo"></div>
              </div>
              <div class="col-md-4">
                <label for="nuevoHora" class="form-label">Hora de llegada *</label>
                <select class="form-select" id="nuevoHora" required></select>
              </div>
              <div class="col-md-4">
                <label for="nuevoServicio" class="form-label">Servicio *</label>
                <select class="form-select" id="nuevoServicio" required></select>
              </div>
            </div>

            <h6 class="text-warning">Cliente</h6>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="nuevoNombre" class="form-label">Nombre *</label>
                <input type="text" class="form-control" id="nuevoNombre" required maxlength="50">
              </div>
              <div class="col-md-6">
                <label for="nuevoApellido" class="form-label">Apellido *</label>
                <input type="text" class="form-control" id="nuevoApellido" required maxlength="50">
              </div>
              <div class="col-md-6">
                <label for="nuevoTelefono" class="form-label">Teléfono (WhatsApp, 10 dígitos) *</label>
                <input type="tel" class="form-control" id="nuevoTelefono" required pattern="[\d\-\+\(\)\s]+" placeholder="55 1234 5678">
              </div>
              <div class="col-md-6">
                <label for="nuevoEmail" class="form-label">Email (opcional)</label>
                <input type="email" class="form-control" id="nuevoEmail" placeholder="cliente@email.com">
              </div>
            </div>

            <h6 class="text-warning">Vehículo</h6>
            <div class="row g-3">
              <div class="col-md-4">
                <label for="nuevoPatente" class="form-label">Patente *</label>
                <input type="text" class="form-control" id="nuevoPatente" required maxlength="10" style="text-transform: uppercase;" placeholder="AB123CD">
              </div>
              <div class="col-md-4">
                <label for="nuevoMarca" class="form-label">Marca *</label>
                <select class="form-select" id="nuevoMarca" required></select>
              </div>
              <div class="col-md-4">
                <label for="nuevoModelo" class="form-label">Modelo *</label>
                <input type="text" class="form-control" id="nuevoModelo" required maxlength="50">
              </div>
              <div class="col-md-4">
                <label for="nuevoAnio" class="form-label">Año</label>
                <input type="number" class="form-control" id="nuevoAnio" min="1950" max="2100">
              </div>
              <div class="col-md-4">
                <label for="nuevoColor" class="form-label">Color</label>
                <input type="text" class="form-control" id="nuevoColor" maxlength="30">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-warning">
          <button type="button" class="btn btn-secundario" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" form="formNuevoTurno" class="btn btn-primario" id="btn-guardar-turno">
            <i class="bi bi-check-lg me-1"></i>Guardar turno
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: detalle del turno -->
  <div class="modal fade" id="modalDetalle" tabindex="-1" aria-labelledby="modalDetalleLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-dark border-info">
        <div class="modal-header border-info">
          <h5 class="modal-title text-info" id="modalDetalleLabel">
            <i class="bi bi-card-text me-2"></i>Detalle del turno
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body text-white">
          <dl class="row mb-0" id="detalle-contenido"></dl>
          <div id="detalle-documentos" class="mt-3"></div>
        </div>
        <div class="modal-footer border-info">
          <button type="button" class="btn btn-secundario" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: confirmar eliminación -->
  <div class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="modalEliminarLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content bg-dark border-danger">
        <div class="modal-header border-danger">
          <h5 class="modal-title text-danger" id="modalEliminarLabel">
            <i class="bi bi-exclamation-triangle me-2"></i>Eliminar turno
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body text-white" id="textoEliminar"></div>
        <div class="modal-footer border-danger">
          <button type="button" class="btn btn-secundario" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">
            <i class="bi bi-trash me-1"></i>Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Avisos -->
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="notificationToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toastMessage"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  <script src="../js/panel-turnos.js" type="module"></script>
</body>
</html>
