<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión - Turnos del Taller</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">

        <!-- Encabezado -->
        <div class="text-center mb-5">
          <h1 class="h3 mb-2 fw-bold">Turnos del Taller</h1>
          <p class="text-white">Iniciá sesión para gestionar los turnos</p>
        </div>

        <!-- Avisos de error -->
        <div id="alerta-login"></div>

        <!-- Formulario de login -->
        <form id="loginForm" class="needs-validation" novalidate>

          <!-- Email -->
          <div class="mb-4">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email"
                   class="form-control"
                   id="email"
                   autocomplete="email"
                   required>
            <div class="invalid-feedback">
              Por favor, ingresá un correo electrónico válido.
            </div>
          </div>

          <!-- Contraseña -->
          <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <div class="position-relative">
              <input type="password"
                     class="form-control"
                     id="password"
                     autocomplete="current-password"
                     required>
              <button type="button"
                      class="btn btn-link position-absolute end-0 top-50 translate-middle-y me-2 p-1"
                      id="togglePassword"
                      style="color: #ff6600; text-decoration: none;">
                👁️
              </button>
            </div>
            <div class="invalid-feedback">
              La contraseña es obligatoria.
            </div>
          </div>

          <!-- Botón de login -->
          <button type="submit" class="btn btn-primario w-100 py-3 mb-4">
            <span class="login-text">Iniciar sesión</span>
            <div class="spinner-border spinner-border-sm d-none" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
          </button>

        </form>

      </div>
    </div>
  </div>
  <script type="module" src="./login.js"></script>
</body>
</html>
