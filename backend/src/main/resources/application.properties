# PostgreSQL settings
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=${PORT:8080}

# Hibernate (JPA) settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
# Sin valor por defecto: si JWT_SECRET no está definido, el arranque falla (fail-closed).
# Generar uno fuerte: openssl rand -base64 32
jwt.secret=${JWT_SECRET}

# Seed admin (creado automaticamente si no existe ninguno)
admin.seed.email=${ADMIN_SEED_EMAIL:admin@admin.com}
admin.seed.password=${ADMIN_SEED_PASSWORD:admin1234}

# Archivos PDF de diagnóstico (Supabase Storage)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
documentos.max-bytes=5242880
supabase.url=${SUPABASE_URL:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.bucket=${SUPABASE_BUCKET:diagnosticos}