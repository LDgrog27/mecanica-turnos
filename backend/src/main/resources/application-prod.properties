# Perfil de producción (Render / PaaS)
# Swagger UI y OpenAPI docs se deshabilitan para no exponer la superficie de la API.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Orígenes del frontend autorizados a llamar a la API (separados por coma, sin barra final).
# Se define con la variable de entorno CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}